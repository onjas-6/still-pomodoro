name: macOS
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test.sh
      - run: ./scripts/test-journal.sh
      - run: ./scripts/test-inspiration.sh
      - run: swift test
      - run: ./scripts/build.sh
        env:
          STILL_INSTALL_PATH: build/Still.app
      - run: ./build/Still.app/Contents/MacOS/Still --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: Still-macOS
          path: build/Still.app
